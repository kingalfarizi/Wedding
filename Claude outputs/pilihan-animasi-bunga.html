<html lang="id">

<title>Pilihan Animasi Bunga Sudut</title>

<style>
    :root {
        --bg: #1f1812;
        --ink: #f7eee2;
        --muted: #cdbba3;
        --gold: #e2c794;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Josefin Sans', system-ui, sans-serif;
    }
    header {
        text-align: center;
        padding: 28px 16px 8px;
    }
    header h1 {
        font-family: 'Sacramento', cursive;
        font-weight: 400;
        font-size: 2.6rem;
        margin: 0;
        color: var(--gold);
    }
    header p {
        color: var(--muted);
        margin: 6px auto 14px;
        max-width: 560px;
        line-height: 1.5;
        font-size: 0.95rem;
    }
    .replay {
        border: 1px solid var(--gold);
        background: linear-gradient(135deg, #fbf4e6, #e2c794);
        color: #3b2f25;
        border-radius: 999px;
        padding: 8px 20px;
        font-family: inherit;
        font-size: 0.9rem;
        cursor: pointer;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 22px 16px;
        padding: 20px 16px 40px;
        max-width: 1100px;
        margin: 0 auto;
    }
    .item { text-align: center; }
    .item h2 {
        font-size: 1rem;
        margin: 10px 0 2px;
        color: var(--gold);
    }
    .item p {
        margin: 0;
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.45;
    }
    .num {
        display: inline-block;
        min-width: 1.6em;
        padding: 1px 6px;
        margin-right: 4px;
        border-radius: 999px;
        background: var(--gold);
        color: #3b2f25;
        font-size: 0.8rem;
    }

    .phone::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
    }
    .phone .title {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Sacramento', cursive;
        font-size: 1.9rem;
        z-index: 2;
    }

    /* ---------- susunan 4 sudut ---------- */
    .corner {
        position: absolute;
        width: 44%;
        z-index: 1;
        line-height: 0;
        pointer-events: none;
    }
    .corner .m { display: block; }
    .corner img {
        display: block;
        width: 100%;
        transform-origin: top right;   /* titik tempel bunga pada gambar asli */
    }
    .tl { top: 0; left: 0; }
    .tr { top: 0; right: 0; }
    .bl { bottom: 0; left: 0; }
    .br { bottom: 0; right: 0; }
    .tl .m { transform: scaleX(-1); }
    .bl .m { transform: scale(-1, -1); }
    .br .m { transform: scaleY(-1); }

    /* jeda tiap sudut sedikit berbeda agar tidak serempak */
    .tr img { animation-delay: -1s !important; }
    .bl img { animation-delay: -2s !important; }
    .br img { animation-delay: -3s !important; }

    /* 1. Goyang lembut */
    .a1 img { animation: sway 5s ease-in-out infinite alternate; }
    @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }

    /* 2. Tertiup angin */
    .a2 img { animation: wind 4.5s ease-in-out infinite; }
    @keyframes wind {
        0%, 100% { transform: rotate(0) skewX(0); }
        20% { transform: rotate(4deg) skewX(3deg); }
        35% { transform: rotate(1deg) skewX(-1deg); }
        50% { transform: rotate(5deg) skewX(4deg); }
        70% { transform: rotate(-2deg) skewX(-2deg); }
    }

    /* 3. Bernapas */
    .a3 img { animation: breathe 4s ease-in-out infinite alternate; }
    @keyframes breathe { from { transform: scale(1); } to { transform: scale(1.08); } }

    /* 4. Melayang */
    .a4 img { animation: float 3.5s ease-in-out infinite alternate; }
    @keyframes float {
        from { transform: translateY(-5px) rotate(-1.5deg); }
        to { transform: translateY(5px) rotate(1.5deg); }
    }

    /* 5. Mekar saat muncul */
    .a5 img {
        animation: bloom 1.6s cubic-bezier(.2, .9, .3, 1.3) both, sway 5s 1.6s ease-in-out infinite alternate;
    }
    .a5 .tr img { animation-delay: 0.2s, 1.8s !important; }
    .a5 .bl img { animation-delay: 0.4s, 2s !important; }
    .a5 .br img { animation-delay: 0.6s, 2.2s !important; }
    @keyframes bloom {
        from { transform: scale(0.1) rotate(-35deg); opacity: 0; }
        to { transform: scale(1) rotate(0); opacity: 1; }
    }

    /* 6. Masuk dari sudut */
    .a6 .corner { animation: slide-in 1.4s cubic-bezier(.2, .8, .2, 1) both; }
    .a6 .tl { --x: -70%; --y: -70%; }
    .a6 .tr { --x: 70%; --y: -70%; animation-delay: 0.15s; }
    .a6 .bl { --x: -70%; --y: 70%; animation-delay: 0.3s; }
    .a6 .br { --x: 70%; --y: 70%; animation-delay: 0.45s; }
    .a6 img { animation: sway 5s 1.4s ease-in-out infinite alternate; }
    @keyframes slide-in {
        from { transform: translate(var(--x), var(--y)); opacity: 0; }
        to { transform: none; opacity: 1; }
    }

    /* 7. Berkilau */
    .a7 img { animation: sway 5s ease-in-out infinite alternate, glow 3s ease-in-out infinite; }
    @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 0 rgba(255, 230, 180, 0)) brightness(1); }
        50% { filter: drop-shadow(0 0 10px rgba(255, 230, 180, 0.8)) brightness(1.12); }
    }

    /* 8. Kelopak berguguran dari bunga */
    .a8 img { animation: sway 5s ease-in-out infinite alternate; }
    .petal {
        position: absolute;
        z-index: 1;
        width: 7px;
        height: 9px;
        border-radius: 150% 0 150% 0;
        background: linear-gradient(135deg, #ffe1e6, #f3a6b5);
        opacity: 0;
        animation: drop 5s linear infinite;
    }
    @keyframes drop {
        0% { opacity: 0; transform: translate(0, 0) rotate(0); }
        10% { opacity: 0.9; }
        100% { opacity: 0; transform: translate(var(--dx), 170px) rotate(300deg); }
    }

    /* 9. Denyut bergantian */
    .a9 img { animation: pulse 4s ease-in-out infinite; }
    .a9 .tl img { animation-delay: 0s !important; }
    .a9 .tr img { animation-delay: 1s !important; }
    .a9 .br img { animation-delay: 2s !important; }
    .a9 .bl img { animation-delay: 3s !important; }
    @keyframes pulse {
        0%, 40%, 100% { transform: scale(1) rotate(0); }
        15% { transform: scale(1.1) rotate(2deg); }
    }

    @media (prefers-reduced-motion: reduce) {
        .note { display: block; }
    }
    .note {
        display: none;
        text-align: center;
        color: var(--gold);
        font-size: 0.85rem;
    }
</style>
</head>

<header>
    <h1>Pilihan Animasi Bunga Sudut</h1>
    <p>Setiap kotak adalah contoh tampilan HP dengan bunga di 4 sudut. Pilih nomor yang Anda suka. Animasi juga bisa digabung, misalnya nomor 6 + 7.</p>

</header>

    const options = [
        ['Goyang Lembut', 'Bunga berayun pelan ke kiri-kanan dari titik tempelnya. Yang dipakai sekarang.'],
        ['Tertiup Angin', 'Gerakan tidak beraturan, seperti daun tertiup angin sepoi-sepoi.'],
        ['Bernapas', 'Bunga membesar-mengecil perlahan, kesan tenang dan hidup.'],
        ['Melayang', 'Bunga naik-turun lembut seperti mengapung.'],
        ['Mekar Saat Muncul', 'Bunga "tumbuh" dari kecil sambil berputar, lalu bergoyang lembut.'],
        ['Masuk dari Sudut', 'Bunga meluncur masuk dari luar layar satu per satu, lalu bergoyang.'],
        ['Berkilau', 'Goyang lembut plus cahaya keemasan berdenyut di sekeliling bunga.'],
        ['Kelopak Berguguran', 'Goyang lembut plus kelopak kecil yang jatuh dari tiap bunga.'],
        ['Denyut Bergantian', 'Keempat bunga berdenyut bergiliran searah jarum jam.'],
    ];

    const grid = document.getElementById('grid');

    const petals = () => {
        let html = '';
        const spots = [[18, 22], [80, 20], [20, 76], [78, 78]];
        spots.forEach(([x, y], i) => {
            for (let k = 0; k < 3; k++) {
                const dx = (Math.random() * 60 - 30).toFixed(0);
                html += `<span class="petal" style="left:${x + k * 3}%;top:${y}%;--dx:${dx}px;animation-delay:${(i * 1.2 + k * 1.7).toFixed(1)}s"></span>`;
            }
        });
        return html;
    };

    const render = () => {
        grid.innerHTML = options.map(([name, desc], i) => {
            const corners = ['tl', 'tr', 'bl', 'br']
                .map((c) => `<div class="corner ${c}"><span class="m"><img src="${FLOWER}" alt=""></span></div>`)
                .join('');
            return `<section class="item">
                <div class="phone a${i + 1}">${corners}${i === 7 ? petals() : ''}<div class="title">Dito &amp; Nike</div></div>
                <h2><span class="num">${i + 1}</span>${name}</h2>
                <p>${desc}</p>
            </section>`;
        }).join('');
    };

    render();
    document.getElementById('replay').addEventListener('click', render);
