<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: #2a2019;
        color: #f7eee2;
        font-family: 'Josefin Sans', system-ui, sans-serif;
    }
    header { text-align: center; padding: 28px 16px 4px; }
    header h1 { font-family: 'Sacramento', cursive; font-weight: 400; font-size: 2.6rem; margin: 0; color: #e2c794; }
    header p { color: #cdbba3; margin: 6px auto 0; max-width: 520px; line-height: 1.5; font-size: .95rem; }
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 44px 18px;
        padding: 44px 16px 40px;
        max-width: 1000px;
        margin: 0 auto;
    }
    .card {
        position: relative;
        text-align: center;
        color: #3b2f25;
        background:
            radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.55) 0%, transparent 55%),
            linear-gradient(135deg, #fbf4e6 0%, #efdcb8 55%, #e2c794 100%);
        border: 1px solid rgba(255, 236, 200, .95);
        border-radius: 1.1rem;
        padding: 2rem 1rem 1.1rem;
        box-shadow: 0 .6rem 1.4rem rgba(0,0,0,.35), 0 0 0 5px rgba(226,199,148,.15);
    }
    .card::before {
        content: "";
        position: absolute;
        inset: 6px;
        border: 1px solid rgba(111, 78, 55, .3);
        border-radius: .85rem;
        pointer-events: none;
    }
    .pin {
        position: absolute;
        top: -1.35rem;
        left: 50%;
        transform: translateX(-50%);
        width: 2.7rem;
        height: 2.7rem;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 1.1rem;
        color: #fff8ec;
        background: linear-gradient(135deg, #8a6a45 0%, #6f4e37 100%);
        box-shadow: 0 0 0 4px #fbf4e6, 0 .35rem .8rem rgba(0,0,0,.35);
    }
    .title { font-family: 'Sacramento', cursive; font-size: 2.6rem; margin: 0; line-height: 1.2; }
    .time {
        display: inline-block;
        margin: .3rem 0 .2rem;
        padding: .35rem .9rem;
        border-radius: 50rem;
        font-size: .82rem;
        background: rgba(111, 78, 55, .1);
        border: 1px solid rgba(111, 78, 55, .25);
    }
    .label { margin-top: 12px; text-align: center; font-size: .9rem; }
    .label b {
        display: inline-block;
        min-width: 1.7em;
        padding: 1px 7px;
        margin-right: 6px;
        border-radius: 999px;
        background: #e2c794;
        color: #3b2f25;
    }
    .label small { display: block; color: #cdbba3; margin-top: 4px; font-size: .78rem; }
    .current { outline: 2px dashed #e2c794; outline-offset: 6px; }
</style>
</head>
<body>
<header>
    <h1>Pilihan Ikon Akad</h1>
    <p>Pilih nomor ikon yang paling cocok untuk kartu Akad. Kartu bergaris putus-putus adalah ikon yang dipakai sekarang.</p>
</header>
<main class="grid" id="grid"></main>

        ['fa-solid fa-heart-circle-check', 'Hati Tercentang', 'Simbol "sah"'],
        ['fa-solid fa-hand-holding-heart', 'Tangan & Hati', 'Menyerahkan hati'],
        ['fa-solid fa-handshake', 'Berjabat Tangan', 'Momen ijab kabul'],
        ['fa-solid fa-handshake-simple', 'Jabat Tangan (simpel)', 'Versi garis lebih ringan'],
        ['fa-solid fa-mosque', 'Masjid', 'Nuansa islami'],
        ['fa-solid fa-book-quran', 'Al-Qur\'an', 'Mahar / tilawah'],
        ['fa-solid fa-star-and-crescent', 'Bulan Bintang', 'Nuansa islami'],
        ['fa-solid fa-hands-praying', 'Tangan Berdoa', 'Doa & restu'],
        ['fa-solid fa-dove', 'Merpati', 'Simbol kesetiaan'],
        ['fa-solid fa-file-signature', 'Tanda Tangan', 'Menandatangani buku nikah'],
        ['fa-solid fa-pen-fancy', 'Pena', 'Elegan, tanda tangan'],
        ['fa-solid fa-scroll', 'Gulungan', 'Seperti piagam / akta'],
        ['fa-solid fa-infinity', 'Tak Terhingga', 'Cinta selamanya'],
    ];
    document.getElementById('grid').innerHTML = icons.map(([cls, name, note], i) => `
        <div>
            <div class="card${i === 0 ? ' current' : ''}">
                <span class="pin"><i class="${cls}"></i></span>
                <h2 class="title">Akad</h2>
                <span class="time"><i class="fa-regular fa-clock" style="margin-right:.4rem"></i>Pukul 09.00 WIB - Selesai</span>
            </div>
            <div class="label"><b>${i + 1}</b>${name}<small>${note}</small></div>
        </div>`).join('');
</script>
</body>
