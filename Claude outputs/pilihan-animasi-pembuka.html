* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Josefin Sans', system-ui, sans-serif; }
header { text-align: center; padding: 26px 16px 6px; }
header h1 { font-family: 'Sacramento', cursive; font-weight: 400; font-size: 2.6rem; margin: 0; color: var(--gold); }
header p { color: var(--muted); margin: 6px auto 14px; max-width: 560px; line-height: 1.5; font-size: .95rem; }
.replay {
    border: 0; border-radius: 999px; padding: 9px 22px; cursor: pointer;
    font-family: inherit; font-size: .9rem; color: #3b2f25;
    background: linear-gradient(135deg, #fbf4e6, #e2c794);
}
.grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 30px 18px; padding: 22px 16px 44px; max-width: 1120px; margin: 0 auto; justify-items: center;
}
.item { text-align: center; width: 230px; }
.item h2 { font-size: 1rem; margin: 12px 0 3px; color: var(--gold); font-weight: 600; }
.item p { margin: 0; font-size: .8rem; color: var(--muted); line-height: 1.45; }
.num { display: inline-block; min-width: 1.6em; padding: 1px 6px; margin-right: 5px; border-radius: 999px; background: var(--gold); color: #3b2f25; font-size: .8rem; }
.tag { display: inline-block; margin-left: 4px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--gold); color: var(--gold); font-size: .65rem; vertical-align: 2px; }

/* ---------- HP mini ---------- */
.phone {
    position: relative; width: 230px; height: 410px; margin: 0 auto;
    border-radius: 22px; overflow: hidden; cursor: pointer; isolation: isolate;
    background: #0d0a08;
    box-shadow: 0 12px 26px rgba(0,0,0,.5), inset 0 0 0 1px rgba(226,199,148,.25);
}

const cardInner = () => `
    <div class="ly l1"></div><div class="ly l2"></div><div class="ly l3"></div>
    <div class="content">
        <div class="c-title">The Wedding</div>
        <img class="c-photo" src="${IMG.photo}" alt="">
        <div class="c-names">Dito &amp; Nike</div>
        <div class="c-date">1 . 11 . 2026</div>
        <div class="c-guest"><small>Kepada Yth Bapak/Ibu/Saudara/i</small><b>Bapak Budi Santoso</b></div>
        <span class="c-btn">&#9993; Buka Undangan</span>
    </div>`;

// garis bingkai (variasi 5): kotak 180x322 dengan sudut melengkung ke dalam, r=18 + jarak 5
const framePath = (() => {
    const w = 180, h = 322, o = 5.5, R = 23.5, k = Math.sqrt(R * R - o * o);
    return `M ${k} ${o} L ${w - k} ${o} A ${R} ${R} 0 0 0 ${w - o} ${k}
            L ${w - o} ${h - k} A ${R} ${R} 0 0 0 ${w - k} ${h - o}
            L ${k} ${h - o} A ${R} ${R} 0 0 0 ${o} ${h - k}
            L ${o} ${k} A ${R} ${R} 0 0 0 ${k} ${o} Z`;
})();

const extras = {
    2: '<div class="curtain l"></div><div class="curtain r"></div>',
    3: '<div class="door l"></div><div class="door r"></div>',
    4: '<div class="env"><div class="env-back"></div><div class="env-front"></div><div class="env-flap"></div><div class="env-seal">D&amp;N</div></div>',
    9: '<div class="fog"></div>',
    10: '<div class="beam"></div>',
    11: `<img class="bigphoto" src="${IMG.photo}" alt="">`,
    13: '<div class="split t"><span>Dito</span></div><div class="split b"><span>Nike</span></div>',
    14: '<div class="hand">Dito &amp; Nike</div>',
};
const sparks = () => Array.from({ length: 16 }, () =>
    `<span class="spark" style="left:${(Math.random() * 92).toFixed(0)}%;top:${(Math.random() * 92).toFixed(0)}%;--s:${(6 + Math.random() * 10).toFixed(0)}px;animation-delay:${(Math.random() * 2.2).toFixed(2)}s">&#10022;</span>`).join('');

const petals = () => Array.from({ length: 10 }, (_, i) =>
    `<span class="petal" style="left:${(i * 10 + Math.random() * 8).toFixed(0)}%;--dx:${(Math.random() * 60 - 30).toFixed(0)}px;animation-delay:${(1 + i * 0.45).toFixed(2)}s"></span>`).join('');

const phone = (i) => {
    const n = i + 1;
    let card = cardInner();
    if (n === 5) card += `<svg class="draw" viewBox="0 0 180 322" aria-hidden="true"><path d="${framePath}"/></svg>`;
    if (n === 8) card += `<div class="cover"><div class="ly"></div><div class="cover-line"></div><div class="cover-mono"><b>D&amp;N</b><span>1 . 11 . 2026</span></div></div>`;
    return `<div class="scene">
            <div class="bgimg"></div><div class="shade"></div>
            <img class="fl tl" src="${IMG.tl}" alt=""><img class="fl tr" src="${IMG.tr}" alt=""><img class="fl bot" src="${IMG.bot}" alt="">
        </div>
        ${n === 7 ? petals() : ''}${n === 15 ? sparks() : ''}
        ${extras[n] || ''}
        <div class="card">${card}</div>`;
};

const grid = document.getElementById('grid');
grid.innerHTML = options.map(([name, desc, now, isNew], i) => `
    <section class="item">
        <div class="phone stagger v${i + 1}" data-i="${i}" title="Ketuk untuk memutar ulang">${phone(i)}</div>
        <h2><span class="num">${i + 1}</span>${name}${now ? '<span class="tag">sekarang</span>' : ''}${isNew ? '<span class="tag">baru</span>' : ''}</h2>
        <p>${desc}</p>
    </section>`).join('');

const setPy = (el) => {
    const ph = el.querySelector('.c-photo');
    if (!ph) return;
    const a = el.getBoundingClientRect(), b = ph.getBoundingClientRect();
    el.style.setProperty('--py', `${(((b.top + b.height / 2) - a.top - 10) / a.height * 100).toFixed(1)}%`);
};
const replay = (el) => { el.innerHTML = phone(+el.dataset.i); setPy(el); };
grid.querySelectorAll('.phone').forEach(setPy);
grid.addEventListener('click', (e) => { const p = e.target.closest('.phone'); if (p) replay(p); });
document.getElementById('replay-all').addEventListener('click', () => grid.querySelectorAll('.phone').forEach(replay));
</script>
</body>
</html>
