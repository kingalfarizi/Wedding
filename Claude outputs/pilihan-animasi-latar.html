header { text-align: center; padding: 24px 16px 4px; }
header h1 { font-family: 'Sacramento', cursive; font-weight: 400; font-size: 2.6rem; margin: 0; color: #e2c794; }
header p { color: #cdbba3; margin: 6px auto 0; max-width: 580px; line-height: 1.5; font-size: .95rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 28px 18px; padding: 24px 16px 44px; max-width: 1120px; margin: 0 auto; justify-items: center; }
.item { width: 230px; text-align: center; }
.item h2 { font-size: 1rem; margin: 12px 0 3px; color: #e2c794; font-weight: 600; }
.item p { margin: 0; font-size: .8rem; color: #cdbba3; line-height: 1.45; }
.num { display: inline-block; min-width: 1.6em; padding: 1px 6px; margin-right: 5px; border-radius: 999px; background: #e2c794; color: #3b2f25; font-size: .8rem; }
.phone { position: relative; width: 230px; height: 410px; border-radius: 22px; overflow: hidden; isolation: isolate; background: #2a2019;
    box-shadow: 0 12px 26px rgba(0,0,0,.5), inset 0 0 0 1px rgba(226,199,148,.25); }

.title { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
.title b { font-family: 'Sacramento', cursive; font-weight: 400; font-size: 2.4rem; line-height: 1; }
.title span { font-size: .6rem; letter-spacing: .3em; margin-top: 6px; }
.fx { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.fx i { position: absolute; display: block; }

/* 1 kupu-kupu */
.bf { width: 22px; height: 18px; animation: bf-fly var(--d) ease-in-out var(--dl) infinite; }
.bf::before, .bf::after { content: ""; position: absolute; top: 0; width: 11px; height: 16px; border-radius: 60% 40% 50% 50%;
    background: radial-gradient(circle at 40% 40%, #fbe3b8, #e2a66b 70%); animation: bf-flap .25s ease-in-out infinite alternate; }
.bf::before { left: 0; transform-origin: right center; }
.bf::after { right: 0; transform-origin: left center; border-radius: 40% 60% 50% 50%; }
@keyframes bf-flap { to { transform: scaleX(.25); } }
@keyframes bf-fly { 0% { transform: translate(-30px, 380px) rotate(10deg); } 25% { transform: translate(80px, 250px) rotate(-10deg); } 50% { transform: translate(150px, 290px) rotate(15deg); }
    75% { transform: translate(200px, 120px) rotate(-5deg); } 100% { transform: translate(260px, -40px) rotate(10deg); } }

/* 2 kilauan emas */
.gl { width: var(--s); height: var(--s); background: radial-gradient(circle, #fff6d6, #e2c794 40%, transparent 70%); border-radius: 50%; animation: gl-tw var(--d) ease-in-out var(--dl) infinite; }
.gl::before, .gl::after { content: ""; position: absolute; left: 50%; top: 50%; width: 260%; height: 1px; background: linear-gradient(90deg, transparent, #fff3c9, transparent); transform: translate(-50%, -50%); }
.gl::after { transform: translate(-50%, -50%) rotate(90deg); }
@keyframes gl-tw { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }

/* 3 kunang-kunang */
.ff { width: 5px; height: 5px; border-radius: 50%; background: #fff3b0; box-shadow: 0 0 10px 4px rgba(255,220,120,.7);
    animation: ff-move var(--d) ease-in-out var(--dl) infinite alternate, ff-blink 1.6s ease-in-out var(--dl) infinite alternate; }
@keyframes ff-move { to { transform: translate(var(--x), var(--y)); } }
@keyframes ff-blink { from { opacity: .1; } to { opacity: 1; } }

/* 4 hati melayang naik */
.ht { width: 14px; height: 14px; bottom: -20px; background: #e895a7; transform: rotate(45deg); opacity: 0; animation: ht-up var(--d) ease-in var(--dl) infinite; }
.ht::before, .ht::after { content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: inherit; }
.ht::before { left: -7px; } .ht::after { top: -7px; }
@keyframes ht-up { 0% { opacity: 0; transform: translate(0, 0) rotate(45deg) scale(.6); } 15% { opacity: .85; } 100% { opacity: 0; transform: translate(var(--x), -440px) rotate(45deg) scale(1); } }

/* 5 lampion terbang */
.ln { width: 16px; height: 22px; bottom: -30px; border-radius: 40% 40% 30% 30%; background: linear-gradient(180deg, #ffd78a, #f39a3d);
    box-shadow: 0 0 14px 5px rgba(255,170,70,.55); animation: ln-up var(--d) linear var(--dl) infinite; }
.ln::after { content: ""; position: absolute; left: 4px; right: 4px; bottom: -3px; height: 3px; background: #7a4a1e; border-radius: 2px; }
@keyframes ln-up { 0% { transform: translate(0, 0) scale(var(--sc)); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(var(--x), -470px) scale(calc(var(--sc) * .6)); opacity: .2; } }

/* 6 bokeh cahaya */
.bk { width: var(--s); height: var(--s); border-radius: 50%; background: radial-gradient(circle, rgba(255,226,170,.55), rgba(255,200,140,.12) 60%, transparent 70%);
    animation: bk-drift var(--d) ease-in-out var(--dl) infinite alternate; filter: blur(1px); }
@keyframes bk-drift { from { transform: translate(0, 0); opacity: .3; } to { transform: translate(var(--x), var(--y)); opacity: .9; } }

/* 7 benih dandelion */
.dd { width: 18px; height: 18px; animation: dd-float var(--d) linear var(--dl) infinite; opacity: 0; }
.dd::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: repeating-conic-gradient(rgba(255,255,255,.85) 0 4deg, transparent 4deg 30deg);
    -webkit-mask: radial-gradient(circle, transparent 2px, #000 3px); mask: radial-gradient(circle, transparent 2px, #000 3px); }
.dd::after { content: ""; position: absolute; left: 50%; top: 50%; width: 1px; height: 14px; background: rgba(255,255,255,.8); }
@keyframes dd-float { 0% { transform: translate(-30px, 0) rotate(0); opacity: 0; } 10% { opacity: .9; } 50% { transform: translate(110px, -40px) rotate(90deg); }
    90% { opacity: .8; } 100% { transform: translate(270px, 30px) rotate(200deg); opacity: 0; } }

/* 8 sinar matahari */
.ray { left: -40%; top: -30%; width: 180%; height: 160%; background: repeating-conic-gradient(from 200deg at 15% 0%, rgba(255,220,160,.16) 0 3deg, transparent 3deg 11deg);
    animation: ray-sway 9s ease-in-out infinite alternate; mix-blend-mode: screen; }
@keyframes ray-sway { from { transform: rotate(-4deg); opacity: .5; } to { transform: rotate(4deg); opacity: 1; } }

/* 9 daun berguguran */
.lf { width: 14px; height: 9px; top: -20px; border-radius: 0 100% 0 100%; background: linear-gradient(135deg, #b6c49a, #7c8f5f); opacity: 0;
    animation: lf-fall var(--d) linear var(--dl) infinite; }
@keyframes lf-fall { 0% { transform: translate(0, 0) rotate(0); opacity: 0; } 10% { opacity: .9; } 50% { transform: translate(calc(var(--x) * -1), 220px) rotate(200deg) rotateX(60deg); }
    100% { transform: translate(var(--x), 450px) rotate(420deg); opacity: 0; } }

/* 10 bintang jatuh */
.ss { width: 70px; height: 1.5px; background: linear-gradient(90deg, rgba(255,250,230,0), #fffbe8); border-radius: 2px; opacity: 0;
    animation: ss-go var(--d) ease-out var(--dl) infinite; transform: rotate(-30deg); }
@keyframes ss-go { 0% { opacity: 0; transform: translate(0, 0) rotate(-30deg); } 4% { opacity: 1; } 12% { opacity: 0; transform: translate(-180px, 105px) rotate(-30deg); } 100% { opacity: 0; transform: translate(-180px, 105px) rotate(-30deg); } }

@media (prefers-reduced-motion: reduce) { .note { display: block !important; } }
.note { display: none; color: #e2c794; font-size: .85rem; }
</style>
